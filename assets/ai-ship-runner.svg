<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">UTKARSH.EXE - AI Ship Runner</title>
  <desc id="desc">A polished animated cyberpunk game banner with an AI ship flying through software obstacles.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="42%" stop-color="#071427"/>
      <stop offset="72%" stop-color="#11113a"/>
      <stop offset="100%" stop-color="#190b2f"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="38%" stop-color="#38bdf8"/>
      <stop offset="66%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="72%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="34%" stop-color="#fb7185"/>
      <stop offset="68%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hazard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1029"/>
      <stop offset="100%" stop-color="#190b2f"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.82 0 0 0 0 1.00 0 0 0 0.85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-hot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.97 0 0 0 0 0.30 0 0 0 0 0.54 0 0 0 0.86 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ship-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.24 0 0 0 0 0.76 0 0 0 0 1.00 0 0 0 0.95 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="26" y="26" width="1148" height="448" rx="34"/>
    </clipPath>

    <pattern id="scan-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <style>
      .mono {
        font-family: "SFMono-Regular", "Cascadia Mono", "Consolas", "Liberation Mono", monospace;
      }
      .title {
        fill: #f8fafc;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      .sub {
        fill: #94a3b8;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .tiny {
        fill: #cbd5e1;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .hud {
        fill: #e2e8f0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      .label {
        fill: #fee2e2;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }
      .cyan {
        fill: #38bdf8;
      }
      .pink {
        fill: #fb7185;
      }
      .violet {
        fill: #c4b5fd;
      }
    </style>
  </defs>

  <rect width="1200" height="500" rx="42" fill="#020617"/>
  <rect x="18" y="18" width="1164" height="464" rx="38" fill="url(#space)" stroke="url(#rim)" stroke-width="3"/>
  <rect x="36" y="36" width="1128" height="428" rx="28" fill="url(#scan-grid)" stroke="#38bdf8" stroke-opacity="0.22"/>

  <g clip-path="url(#clip)">
    <g opacity="0.5">
      <path d="M120 388 L575 112 L1040 388" fill="none" stroke="#38bdf8" stroke-opacity="0.12"/>
      <path d="M184 388 L575 112 L976 388" fill="none" stroke="#38bdf8" stroke-opacity="0.13"/>
      <path d="M260 388 L575 112 L900 388" fill="none" stroke="#38bdf8" stroke-opacity="0.16"/>
      <path d="M60 388 H1140" stroke="#38bdf8" stroke-opacity="0.12"/>
      <path d="M100 344 H1100" stroke="#38bdf8" stroke-opacity="0.10"/>
      <path d="M158 304 H1042" stroke="#38bdf8" stroke-opacity="0.08"/>
      <path d="M236 268 H964" stroke="#38bdf8" stroke-opacity="0.08"/>
    </g>

    <g opacity="0.9">
      <g>
        <circle cx="120" cy="88" r="1.4" fill="#f8fafc"/>
        <circle cx="220" cy="132" r="1.2" fill="#38bdf8"/>
        <circle cx="340" cy="80" r="1.5" fill="#a78bfa"/>
        <circle cx="492" cy="146" r="1.2" fill="#ffffff"/>
        <circle cx="650" cy="96" r="1.6" fill="#67e8f9"/>
        <circle cx="792" cy="156" r="1.1" fill="#f0abfc"/>
        <circle cx="930" cy="88" r="1.3" fill="#e0f2fe"/>
        <circle cx="1110" cy="138" r="1.8" fill="#38bdf8"/>
        <path d="M800 286 h58" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
        <path d="M1016 332 h78" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.38"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-420 0" dur="5.5s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(420 0)">
        <circle cx="120" cy="88" r="1.4" fill="#f8fafc"/>
        <circle cx="220" cy="132" r="1.2" fill="#38bdf8"/>
        <circle cx="340" cy="80" r="1.5" fill="#a78bfa"/>
        <circle cx="492" cy="146" r="1.2" fill="#ffffff"/>
        <circle cx="650" cy="96" r="1.6" fill="#67e8f9"/>
        <circle cx="792" cy="156" r="1.1" fill="#f0abfc"/>
        <circle cx="930" cy="88" r="1.3" fill="#e0f2fe"/>
        <circle cx="1110" cy="138" r="1.8" fill="#38bdf8"/>
        <path d="M800 286 h58" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
        <path d="M1016 332 h78" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.38"/>
        <animateTransform attributeName="transform" type="translate" values="420 0;0 0" dur="5.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <g class="mono">
      <text x="68" y="82" class="title">UTKARSH.EXE <tspan class="cyan">// AI SHIP RUNNER</tspan></text>
      <text x="70" y="108" class="sub">NEURAL ROUTE: BUILD - TEST - OPTIMIZE - SHIP</text>
    </g>

    <g class="mono" filter="url(#glow-cyan)">
      <rect x="64" y="126" width="220" height="50" rx="15" fill="#020617" fill-opacity="0.82" stroke="#22d3ee" stroke-opacity="0.68"/>
      <text x="84" y="148" class="tiny">MISSION</text>
      <text x="84" y="166" class="hud"><tspan class="cyan">AI/ML</tspan> BUILD</text>

      <rect x="304" y="126" width="154" height="50" rx="15" fill="#020617" fill-opacity="0.78" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="324" y="148" class="tiny">STATUS</text>
      <text x="324" y="166" class="hud"><tspan class="violet">SHIPPING</tspan></text>
    </g>

    <g class="mono">
      <rect x="862" y="78" width="260" height="150" rx="20" fill="#020617" fill-opacity="0.88" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.72"/>
      <path d="M884 120H1100 M884 160H1100 M884 198H1100" stroke="#334155" stroke-width="1"/>
      <text x="884" y="106" class="hud">LEVEL: <tspan class="cyan">SOFTWARE</tspan></text>
      <text x="884" y="146" class="hud">MODE: <tspan class="violet">BUILDING</tspan></text>
      <text x="884" y="186" class="hud">XP: <tspan class="pink">AI/ML</tspan></text>
      <text x="884" y="216" class="tiny">SIGNAL LOCK</text>
      <rect x="990" y="205" width="90" height="8" rx="4" fill="#0f172a"/>
      <rect x="990" y="205" width="64" height="8" rx="4" fill="#22d3ee">
        <animate attributeName="width" values="42;86;64;92;42" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="1098" cy="100" r="5" fill="#22c55e" filter="url(#glow-cyan)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.95">
      <path d="M82 258 H1118" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="26 22" stroke-linecap="round" filter="url(#glow-cyan)">
        <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="1.15s" repeatCount="indefinite"/>
      </path>
      <path d="M112 218 H1088" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="12 28" stroke-opacity="0.58">
        <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.45s" repeatCount="indefinite"/>
      </path>
      <path d="M112 302 H1088" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="12 28" stroke-opacity="0.58">
        <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.45s" repeatCount="indefinite"/>
      </path>
      <path d="M160 356 H1040" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="42 62" stroke-opacity="0.54">
        <animate attributeName="stroke-dashoffset" from="0" to="-144" dur="2.3s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(194 258)" filter="url(#ship-glow)">
      <animateTransform attributeName="transform" type="translate" values="194 258;194 246;194 258;194 270;194 258" dur="3.6s" repeatCount="indefinite"/>
      <g>
        <path d="M-120 -14 C-156 -34 -197 -26 -224 -4 C-190 5 -154 14 -120 9 Z" fill="url(#flame)" opacity="0.92">
          <animate attributeName="d" values="M-120 -14 C-156 -34 -197 -26 -224 -4 C-190 5 -154 14 -120 9 Z;M-120 -18 C-168 -49 -224 -27 -258 0 C-212 11 -168 18 -120 12 Z;M-120 -14 C-156 -34 -197 -26 -224 -4 C-190 5 -154 14 -120 9 Z" dur="0.42s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.55;1;0.55" dur="0.42s" repeatCount="indefinite"/>
        </path>
        <circle cx="-118" cy="0" r="30" fill="url(#core)" opacity="0.8">
          <animate attributeName="r" values="22;34;22" dur="0.72s" repeatCount="indefinite"/>
        </circle>
        <path d="M-118 0 L-30 -52 L102 0 L-30 52 Z" fill="url(#ship)" stroke="#e0f2fe" stroke-width="2.4"/>
        <path d="M-30 -52 L-4 -118 L36 -20 Z" fill="url(#wing)" stroke="#c4b5fd" stroke-width="2"/>
        <path d="M-30 52 L-4 118 L36 20 Z" fill="url(#wing)" stroke="#c4b5fd" stroke-width="2"/>
        <path d="M-54 -20 L18 -8 L74 0 L18 8 L-54 20" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.6"/>
        <ellipse cx="12" cy="0" rx="34" ry="20" fill="#020617" stroke="#67e8f9" stroke-width="2.5"/>
        <ellipse cx="14" cy="0" rx="15" ry="9" fill="#67e8f9">
          <animate attributeName="opacity" values="0.45;1;0.45" dur="1.05s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="102" cy="0" r="7" fill="#ffffff"/>
        <path d="M120 -6 L162 -6 M120 6 L154 6" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow-cyan)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="0.9s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g class="mono" filter="url(#glow-hot)">
      <g transform="translate(1020 174)">
        <animateTransform attributeName="transform" type="translate" values="1250 174;-220 174;1250 174" dur="7.5s" begin="-1.1s" repeatCount="indefinite"/>
        <rect x="-62" y="-27" width="124" height="54" rx="12" fill="url(#hazard)" stroke="#fb7185" stroke-width="2"/>
        <path d="M-48 -14 L48 14 M48 -14 L-48 14" stroke="#fb7185" stroke-width="2" stroke-opacity="0.72"/>
        <text x="0" y="5" text-anchor="middle" class="label">BUG</text>
      </g>
      <g transform="translate(880 286)">
        <animateTransform attributeName="transform" type="translate" values="1210 286;-180 286;1210 286" dur="8.2s" begin="-2.2s" repeatCount="indefinite"/>
        <rect x="-54" y="-27" width="108" height="54" rx="12" fill="url(#hazard)" stroke="#f472b6" stroke-width="2"/>
        <path d="M-38 -30 V30 M38 -30 V30" stroke="#f472b6" stroke-width="2" stroke-opacity="0.65"/>
        <text x="0" y="5" text-anchor="middle" class="label">404</text>
      </g>
      <g transform="translate(1120 246)">
        <animateTransform attributeName="transform" type="translate" values="1320 246;-210 246;1320 246" dur="6.8s" begin="-3.7s" repeatCount="indefinite"/>
        <rect x="-56" y="-27" width="112" height="54" rx="12" fill="url(#hazard)" stroke="#f97316" stroke-width="2"/>
        <path d="M-44 0 H44" stroke="#f97316" stroke-width="2" stroke-dasharray="8 7">
          <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="0.6s" repeatCount="indefinite"/>
        </path>
        <text x="0" y="5" text-anchor="middle" class="label">LAG</text>
      </g>
      <g transform="translate(1040 358)">
        <animateTransform attributeName="transform" type="translate" values="1290 358;-260 358;1290 358" dur="9.4s" begin="-4.3s" repeatCount="indefinite"/>
        <rect x="-66" y="-27" width="132" height="54" rx="12" fill="url(#hazard)" stroke="#a78bfa" stroke-width="2"/>
        <path d="M-52 -8 H52 M-52 8 H52" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.65"/>
        <text x="0" y="5" text-anchor="middle" class="label">NULL</text>
      </g>
      <g transform="translate(960 210)">
        <animateTransform attributeName="transform" type="translate" values="1360 210;-310 210;1360 210" dur="10.4s" begin="-5.4s" repeatCount="indefinite"/>
        <rect x="-92" y="-27" width="184" height="54" rx="12" fill="url(#hazard)" stroke="#fb7185" stroke-width="2"/>
        <path d="M-76 -16 H76 M-76 16 H76" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.7"/>
        <text x="0" y="5" text-anchor="middle" class="label">DEADLINE</text>
      </g>
      <g transform="translate(1134 304)">
        <animateTransform attributeName="transform" type="translate" values="1260 304;-240 304;1260 304" dur="7.15s" begin="-6.2s" repeatCount="indefinite"/>
        <rect x="-66" y="-27" width="132" height="54" rx="12" fill="url(#hazard)" stroke="#ef4444" stroke-width="2"/>
        <path d="M-48 -16 L48 16 M48 -16 L-48 16" stroke="#ef4444" stroke-width="2" stroke-opacity="0.72"/>
        <text x="0" y="5" text-anchor="middle" class="label">ERROR</text>
      </g>
    </g>

    <g class="mono" opacity="0.72">
      <text x="510" y="143" class="tiny" fill="#67e8f9">model.fit()</text>
      <text x="620" y="342" class="tiny" fill="#c4b5fd">git push</text>
      <text x="474" y="390" class="tiny" fill="#f8fafc">npm test</text>
      <text x="710" y="188" class="tiny" fill="#fda4af">loss--</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;-80 0;0 0" dur="8s" repeatCount="indefinite"/>
    </g>

    <g class="mono">
      <rect x="70" y="404" width="246" height="38" rx="13" fill="#020617" fill-opacity="0.8" stroke="#22d3ee" stroke-opacity="0.65"/>
      <circle cx="94" cy="423" r="6" fill="#22c55e" filter="url(#glow-cyan)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.25s" repeatCount="indefinite"/>
      </circle>
      <text x="114" y="428" class="hud">STATUS: SHIPPING</text>

      <rect x="842" y="404" width="286" height="38" rx="13" fill="#020617" fill-opacity="0.78" stroke="#334155"/>
      <text x="864" y="428" class="tiny">AVOID: BUGS / 404 / LAG / NULL</text>
      <path d="M1072 423h34" stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
        <animate attributeName="opacity" values="0.22;1;0.22" dur="1.05s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <rect x="18" y="18" width="1164" height="464" rx="38" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
